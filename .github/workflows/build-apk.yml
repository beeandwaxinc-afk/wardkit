name: Build Ward Kit Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build R8-optimized Release APK
        run: |
          keytool -genkeypair -noprompt \
            -keystore my-upload-key.jks \
            -storepass android \
            -alias wardkit \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WardKit,O=WardKit,C=US"

          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/my-upload-key.jks" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=wardkit \
            -Pandroid.injected.signing.key.password=android

      - name: Align and sign Release APK
        id: sign
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)

          RAW_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi

          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APK_NAME="WardKit-${GITHUB_REF_NAME}-release.apk"
          else
            APK_NAME="WardKit-release.apk"
          fi

          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/sideload.jks" \
            -storepass android \
            -alias wardkit \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WardKit,O=WardKit,C=US"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/sideload.jks" \
            --ks-pass pass:android \
            --ks-key-alias wardkit \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "dist/$APK_NAME" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose "dist/$APK_NAME"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary files
        if: always()
        run: rm -f my-upload-key.jks "$RUNNER_TEMP/sideload.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/${{ steps.sign.outputs.apk_name }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.sign.outputs.apk_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true

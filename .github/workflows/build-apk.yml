name: Build Ward Kit Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build R8-optimized Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign Release APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)

          RAW_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi

          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APK_NAME="WardKit-${GITHUB_REF_NAME}-release.apk"
          else
            APK_NAME="WardKit-release.apk"
          fi

          # Decode keystore safely outside the repo tree
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wardkit-release.jks"

          # Zipalign for optimal memory mapping on Android
          "$BUILD_TOOLS/zipalign" -p -f 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"

          # Sign with v1/v2/v3 schemes using env-var passwords (no shell-escaping issues)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/wardkit-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "dist/$APK_NAME" \
            "$RUNNER_TEMP/aligned.apk"

          # Verify APK signature before publishing
          "$BUILD_TOOLS/apksigner" verify --verbose "dist/$APK_NAME"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wardkit-release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.sign.outputs.apk_name }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ steps.sign.outputs.apk_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
